[project]
name = "osm-road-weaver"
version = "0.1.0"
description = "A tool reconstruct road datasets from OpenStreetMap ways using stroke-based grouping and road-name matching"
readme = "README.md"
authors = [
    { name = "khoa_vu", email = "anhkhoakioku@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
osm-way-stroke = "osm_road_weaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_road_weaver"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]