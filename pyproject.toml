[project]
name = "osm-road-weaver"
version = "0.1.0"
description = "A tool reconstruct road datasets from OpenStreetMap ways using stroke-based grouping and road-name matching"
readme = "README.md"
authors = [
    { name = "khoa_vu", email = "anhkhoakioku@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "osmnx>=2.1.1",
    "pyarrow>=25.0.1",
    "pyproj>=3.8.0",
    "quackosm>=0.19.0",
    "shapely>=2.2.0",
]

[project.scripts]
osm-road-weaver = "osm_road_weaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_road_weaver"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
notebook = [
    "ipykernel>=7.4.0",
    "lonboard>=0.17.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
]
